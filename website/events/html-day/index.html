<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />

    <title>html day san francisco 2026</title>
  </head>
  <body>
    <!-- 
     - FOG rolls in?
     - sutro tower image / rendering?

     - sf startup billboard that you throw stuff on? lol
     
    -->

    <div class="event-header">
      <div class="star"><span class="star-icon" style="">✺</span></div>
    </div>
    <div class="event-info">
      <p>
        Please join us for
        <b>HTML Day <span style="color: #fb5b1f">San Francisco</span> 2026</b>
        to write some HTML in the park!
      </p>
      <div class="event-details">
        <label>Details</label>
        <p>Aug 8th 1-3PM @ Golden Gate Park (precise location TBD)</p>
      </div>

      <div class="event-details">
        <label>Hosts</label>
        <p>
          <a href="https://spencer.place/">Spencer Chang</a> &
          <a href="https://leiac.me/">Leia Chang</a> as part of
          <a href="https://html.energy">HTML Energy</a>
        </p>
      </div>
      <div class="event-details">
        <label>What to bring</label>
        <p>your laptop or something else to write HTML with!</p>
      </div>

      <!-- TODO: playhtml sign in thing stamp -->
      <!-- <label>Sign</label> -->
      <!-- TODO: playhtml submit your website/file -->
    </div>
  </body>
  <script type="module">
    import { playhtml } from "playhtml";

    // Initialize with cursor tracking
    playhtml.init({
      cursors: {
        enabled: true,
        room: "page",
      },
    });
  </script>
  <style>
    body {
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      /* cool dawn sky */
      background: linear-gradient(
        180deg,
        #aebccb 0%,
        #c6d0da 40%,
        #dfe4e8 100%
      );
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .event-header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 60px;
    }

    .star-icon {
      display: inline-block;
      color: #fb5b1f;
      filter: blur(3px);
      margin-top: 3px;
      font-size: 120px;
      animation: spin 10s linear infinite;
    }

    .event-details p {
      margin-top: 0;
    }

    /* spinning star animation */
    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .event-info {
      position: relative;
      z-index: 1;
      max-width: 400px;
      margin: 0 auto;
      padding: 20px 20px 120px;
      text-align: left;
      line-height: 1.5;
      font-size: 1.2rem;
      color: #333;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(60, 70, 85, 0.18);
    }

    .event-info p:first-child {
      margin-top: 0;
    }

    label {
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.25em;
    }
  </style>
</html>
