# ABOUTME: Runs extension performance traces for pull requests and comments the comparison.
# ABOUTME: Fails when a metric regresses past the threshold so the check can gate merges.

name: Extension Performance Report

# No workflow-level path filter: a required check that never starts blocks merging,
# so every PR starts this job and "Detect extension changes" skips the traces when
# nothing relevant changed.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: "Trace runs per build"
        required: true
        default: "3"

permissions:
  contents: read
  pull-requests: write

jobs:
  compare:
    name: Compare extension trace metrics
    # Playwright 1.59 cannot install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      TRACE_RUNS: ${{ github.event.inputs.runs || '3' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect extension changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare against where the PR branched from, so commits that landed on
          # main after it don't count as this PR's change.
          echo "BASE_SHA=$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")" >> "$GITHUB_ENV"
          pattern='^(extension/src/|extension/package\.json$|extension/wxt\.config\.ts$|packages/[^/]+/src/|scripts/(trace|compare)-extension-performance|\.github/workflows/extension-performance\.yml$|package\.json$|bun\.lock$)'
          # Read the diff into a variable: under pipefail, `grep -q` exiting early
          # would kill `git diff` and read as "no match".
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          if grep -Eq "$pattern" <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No extension changes in this PR, so no performance trace ran." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Bun
        if: steps.changes.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Playwright Chromium
        if: steps.changes.outputs.relevant == 'true'
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/extension-performance"

      - name: Build head extension
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout --detach "${{ github.event.pull_request.head.sha }}"
          else
            git checkout --detach "${{ github.sha }}"
          fi
          bun install --frozen-lockfile
          bun build-packages
          bun run build-extension
          rm -rf "$RUNNER_TEMP/head-extension"
          cp -R extension/dist/chrome-mv3 "$RUNNER_TEMP/head-extension"

      - name: Build base extension
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout --detach "$BASE_SHA"
          else
            git checkout --detach HEAD^
          fi
          bun install --frozen-lockfile
          bun build-packages
          bun run build-extension
          rm -rf "$RUNNER_TEMP/base-extension"
          cp -R extension/dist/chrome-mv3 "$RUNNER_TEMP/base-extension"

      - name: Restore head checkout
        if: always() && steps.changes.outputs.relevant == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout --detach "${{ github.event.pull_request.head.sha }}"
          else
            git checkout --detach "${{ github.sha }}"
          fi
          bun install --frozen-lockfile

      - name: Run extension trace comparison
        if: steps.changes.outputs.relevant == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/extension-performance"
          xvfb-run -a node scripts/trace-extension-performance.mjs \
            --runs "$TRACE_RUNS" \
            --timeout-ms 120000 \
            --mouse-steps 36 \
            --scroll-steps 10 \
            --out-dir "$RUNNER_TEMP/extension-performance" \
            --extension "base:$RUNNER_TEMP/base-extension" \
            --extension "head:$RUNNER_TEMP/head-extension"

      - name: Write performance report
        if: always() && steps.changes.outputs.relevant == 'true'
        run: |
          out="$RUNNER_TEMP/extension-performance"
          mkdir -p "$out"
          status=0
          if [ -f "$out/summary.json" ]; then
            node scripts/compare-extension-performance.mjs \
              --summary "$out/summary.json" \
              --out-dir "$out" \
              --fail-on-regression || status=$?
          else
            {
              echo "<!-- extension-performance-report -->"
              echo "# Extension Performance Report"
              echo ""
              echo "**Result:** the trace did not finish, so nothing was compared. See the workflow logs."
            } > "$out/report.md"
            status=1
          fi
          {
            cat "$out/report.md"
            echo ""
            echo "[Workflow run and trace artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > "$out/comment.md"
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Fork PRs get a read-only token, so they only see the Actions summary.
      - name: Comment on pull request
        if: >-
          always() &&
          steps.changes.outputs.relevant == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const stickyPrComment = require("./.github/scripts/sticky-pr-comment.cjs");
            await stickyPrComment({
              github,
              context,
              marker: "<!-- extension-performance-report -->",
              bodyPath: `${process.env.RUNNER_TEMP}/extension-performance/comment.md`,
            });

      - name: Upload performance artifacts
        if: always() && steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: extension-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/extension-performance
          retention-days: 14
