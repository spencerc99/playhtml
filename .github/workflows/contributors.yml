name: Update contributors

# Keeps the README contributors grid in sync with git history. When someone new
# lands a commit (or a Co-authored-by trailer), this opens or refreshes a PR
# that adds them. Bots and coding agents are filtered out by the script.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

concurrency:
  group: contributors
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      BRANCH: chore/update-contributors
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate contributors
        run: node scripts/update-contributors.mjs --write

      - name: Open or update PR
        run: |
          if git diff --quiet -- README.md; then
            echo "Contributors are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "docs: update README contributors" -- README.md
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "docs: update README contributors" \
              --body "Adds new people to the contributors grid in the README. Generated by \`scripts/update-contributors.mjs\`."
          fi
