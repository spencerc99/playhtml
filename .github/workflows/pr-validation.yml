name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  build-site:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Astro 6 (apps/docs) requires Node >= 22.12.
        node-version: '22'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Prepare workspace
      run: bun run setup

    - name: Run common tests
      run: bun run test:common

    - name: Run core tests
      run: bun run test:playhtml

    - name: Run docs tests
      run: bun run test:docs

    - name: Run react tests
      run: bun run test:react

    - name: Run extension tests
      run: bun run test:extension

    - name: Run extension Worker tests
      run: bun run test:extension-worker

    - name: Lint
      run: bun run lint

    - name: Build site
      run: bun build-site

    - name: Install Playwright browsers
      run: bunx playwright install --with-deps chromium
      working-directory: smoke-tests

    - name: Run smoke tests
      run: bun smoke

    - name: Upload smoke test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-report
        path: |
          smoke-tests/playwright-report
          smoke-tests/test-results
        retention-days: 7
