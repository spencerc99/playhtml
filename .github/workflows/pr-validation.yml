name: PR Validation

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sound-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should-run: ${{ steps.paths.outputs.should-run }}
    steps:
      - name: Check for sound regression inputs
        id: paths
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const soundPaths = [
              /^extension\/website\/shared\/sound\//,
              /^scripts\/sound-samples\//,
              /^extension\/website\/sounds\/(SamplePlayback\.tsx|sampleEvents\.json)$/,
              /^extension\/website\/shared\/utils\/eventUtils\.ts$/,
              /^package\.json$/,
              /^\.github\/workflows\/pr-validation\.yml$/,
            ];
            const shouldRun = files.some(({ filename, previous_filename }) =>
              [filename, previous_filename].filter(Boolean).some((path) =>
                soundPaths.some((pattern) => pattern.test(path)),
              ),
            );
            core.setOutput("should-run", shouldRun);

  build-site:
    # Playwright 1.59 can't install Chromium deps on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Astro 6 (apps/docs) requires Node >= 22.12.
        node-version-file: .nvmrc

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.13

    - name: Cache Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Prepare workspace
      run: bun run setup

    - name: Run common tests
      run: bun run test:common

    - name: Run core tests
      run: bun run test:playhtml

    - name: Run docs tests
      run: bun run test:docs

    - name: Run react tests
      run: bun run test:react

    - name: Run extension tests
      run: bun run test:extension

    - name: Run extension Worker tests
      run: bun run test:extension-worker

    - name: Run extension types tests
      run: bun run test:extension-types

    - name: Run PartyKit server tests
      run: bun run test:partykit

    - name: Run website tests
      run: bun run test:website

    - name: Run repo script tests
      run: bun run test:scripts

    - name: Lint
      run: bun run lint

    - name: Build site
      run: bun build-site

    - name: Install Playwright browsers
      run: bunx playwright install --with-deps chromium
      working-directory: smoke-tests

    - name: Run navigation browser tests
      run: bun run smoke:navigation

    - name: Run extension smoke tests
      run: bun run smoke:extension

    - name: Run smoke tests
      run: bun smoke

    - name: Upload smoke test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-report
        path: |
          smoke-tests/playwright-report
          smoke-tests/test-results
        retention-days: 7

  sound-regression:
    needs: sound-changes
    if: needs.sound-changes.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-sound-${{ hashFiles('bun.lock', 'scripts/sound-samples/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-sound-
      # The scans import extension/website/shared/sound by relative path and only
      # need installed dependencies, not built packages.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install native audio library
        run: sudo apt-get update && sudo apt-get install -y libjack-jackd2-0
      - name: Install native audio renderer
        run: bun install --frozen-lockfile
        working-directory: scripts/sound-samples
      - name: Check audio continuity
        run: bun run test:sound
