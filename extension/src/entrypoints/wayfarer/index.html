<!--
ABOUTME: Hosts the wayfarer map widget shell, framed into host pages by the content script.
ABOUTME: WXT builds this file as wayfarer.html; it frames the hosted internet map in widget mode.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>map — we were online</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }

      body {
        height: 100vh;
        font-family: "Martian Mono", ui-monospace, monospace;
        font-size: 11px;
        color: #3d3833;
      }

      #frame {
        display: flex;
        flex-direction: column;
        height: 100%;
        border: 1px solid rgba(90, 78, 65, 0.25);
        border-radius: 8px;
        overflow: hidden;
        background: transparent;
        box-shadow: 0 2px 10px rgba(61, 56, 51, 0.14);
      }

      #bar {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 24px;
        height: 24px;
        padding: 0 6px;
        box-sizing: border-box;
        background: #f5f0e8;
        border-bottom: 1px solid rgba(90, 78, 65, 0.25);
        user-select: none;
      }

      #dot {
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #8a8279;
      }

      #wordmark {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      /* the bar is narrow: once the map has something to say, that takes the room */
      #bar.has-caption #wordmark {
        display: none;
      }

      #caption {
        flex: 1 1 auto;
        min-width: 0;
        color: #8a8279;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      button {
        flex: 0 0 auto;
        appearance: none;
        border: 0;
        padding: 0 4px;
        height: 16px;
        line-height: 16px;
        background: transparent;
        color: #8a8279;
        font: inherit;
        cursor: pointer;
        border-radius: 3px;
      }

      button:hover,
      button:focus-visible {
        color: #3d3833;
        background: rgba(90, 78, 65, 0.12);
      }

      #map {
        flex: 1 1 auto;
        width: 100%;
        border: none;
        background: transparent;
      }

      #map[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="bar">
        <span id="dot" title="we were online"></span>
        <span id="wordmark">we were online</span>
        <span id="caption"></span>
        <button id="toggle" type="button" aria-label="Collapse map">&#8211;</button>
        <button id="open" type="button" aria-label="Open the internet map" title="Open the internet map">map</button>
      </div>
      <iframe
        id="map"
        title="internet map"
        allow=""
        referrerpolicy="no-referrer"
      ></iframe>
    </div>
    <script type="module" src="./wayfarer.ts"></script>
  </body>
</html>
