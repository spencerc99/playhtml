<!DOCTYPE html>
<!-- ABOUTME: Home screen of the iPhone app that carries the Safari extension. -->
<!-- ABOUTME: Points people into Safari to browse; packageSafariIOS.sh installs it over the packager's page. -->
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; font-src 'self' data:">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <link rel="stylesheet" href="../Style.css">
</head>
<body>
    <main class="home">
        <header class="intro">
            <h1 class="wordmark">we were online</h1>
            <p class="lede">Browse with other people. Your trail, and theirs, shows up on every page you visit.</p>
        </header>

        <a class="commute" href="https://wewere.online/commute">
            <span class="commute__route" aria-hidden="true">
                <span class="commute__stop commute__stop--blue"></span>
                <span class="commute__stop commute__stop--gold"></span>
                <span class="commute__stop commute__stop--rust"></span>
            </span>
            <span class="commute__copy">
                <span class="commute__eyebrow">BOARDING NOW</span>
                <strong class="commute__title">Board the internet commute</strong>
                <span class="commute__detail">A slow train through pages people found lately.</span>
            </span>
            <span class="commute__door" aria-hidden="true"><span></span><span></span></span>
        </a>

        <a class="start" href="https://wewere.online/commute">Start browsing</a>

        <section class="first-time">
            <h2>First time here?</h2>
            <p>Turn it on in Settings, Apps, Safari, Extensions, and allow every website.</p>
        </section>
    </main>
</body>
</html>
